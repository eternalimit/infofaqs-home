<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CATBOT 100 — Mine the Craft</title>
<style>body{margin:0;background:#071325;color:#f6e6b8;font:16px system-ui;text-align:center}main{max-width:740px;margin:5vh auto;padding:24px}button,a{background:#e7ba53;color:#071325;border:0;border-radius:10px;padding:14px 20px;font-weight:bold;cursor:pointer;margin:6px}a{display:inline-block;text-decoration:none}.mine{font-size:60px}progress{width:100%;height:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;background:#14233b;padding:16px;border-radius:10px}</style>
<main><h1>⛏ CATBOT 100</h1><p>Mine the Craft • 100-block local challenge</p><div class="mine">🐈‍⬛</div><h2 id="score">0 / 100 blocks</h2><progress id="bar" value="0" max="100"></progress><p><button id="mine">Mine one block</button><button id="reset">Reset</button></p><p id="status">Ready. No wallet transaction will occur.</p><button id="receipt" disabled>Generate SHA-256 receipt</button><button id="copy" disabled>Copy receipt</button><pre id="output">Receipt pending genuine gameplay.</pre><p><a href="./">← InfoFAQs Home</a></p></main>
<script>
let count=0,events=[],receipt=null;const $=id=>document.getElementById(id);const render=()=>{$('score').textContent=count+' / 100 blocks';$('bar').value=count;$('mine').disabled=count>=100;$('receipt').disabled=count!==100;$('copy').disabled=!receipt;};$('mine').onclick=()=>{if(count>=100)return;count++;events.push({block:count,time:new Date().toISOString()});$('status').textContent=count===100?'100 blocks mined. Generate your receipt.':'Mining locally — '+count+' verified clicks.';render()};$('reset').onclick=()=>{count=0;events=[];receipt=null;$('output').textContent='Receipt pending genuine gameplay.';$('status').textContent='Reset. No wallet transaction.';render()};$('receipt').onclick=async()=>{if(count!==100||!crypto.subtle){$('status').textContent='SHA-256 requires a secure browser context.';return;}const data={game:'CATBOT 100',edition:'Mine the Craft',blocks:count,events,completedAt:new Date().toISOString(),walletTransfer:false};const canonical=JSON.stringify(data);const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical)))).map(x=>x.toString(16).padStart(2,'0')).join('');receipt=JSON.stringify({data,sha256:hash},null,2);$('output').textContent=receipt;$('status').textContent='Local SHA-256 receipt generated. Not minted or transferred.';render()};$('copy').onclick=()=>{if(receipt)navigator.clipboard.writeText(receipt)};render();
</script></html>
