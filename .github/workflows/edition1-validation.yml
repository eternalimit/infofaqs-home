name: Edition 1 static validation
on:
  pull_request:
  push:
    branches:
      - main
      - 'review/**'
permissions:
  contents: read
jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public artifacts and links
        run: python3 scripts/check_edition1.py
